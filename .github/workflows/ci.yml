name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - name: Verify the pinned provider wheel
        run: |
          sha256sum -c deliveryguard-0.2.0.sha256
          sha256sum -c proofgrid_provider_contracts-0.1.0.sha256
          sha256sum -c proofgrid_structured_output-0.1.0.sha256
        working-directory: vendor
      - name: Install pinned provider wheels
        run: |
          python -m pip install vendor/deliveryguard-0.2.0-py3-none-any.whl
          python -m pip install vendor/proofgrid_provider_contracts-0.1.0-py3-none-any.whl
          python -m pip install vendor/proofgrid_structured_output-0.1.0-py3-none-any.whl
      - run: pip install ".[dev]"
      - run: ruff check .
      - run: pytest --cov=support_desk --cov-report=term-missing
