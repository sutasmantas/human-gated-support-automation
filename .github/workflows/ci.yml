name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - name: Verify the pinned provider wheel
        run: sha256sum -c deliveryguard-0.2.0.sha256
        working-directory: vendor
      - run: python -m pip install vendor/deliveryguard-0.2.0-py3-none-any.whl
      - run: pip install ".[dev]"
      - run: ruff check .
      - run: pytest --cov=support_desk --cov-report=term-missing
