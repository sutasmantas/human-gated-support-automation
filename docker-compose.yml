services:
  support-desk:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    volumes:
      - support-data:/app/data/runtime
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:latest
    profiles: ["n8n"]
    ports:
      - "5678:5678"
    environment:
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
    volumes:
      - n8n-data:/home/node/.n8n
      - ./n8n:/workflows:ro
    depends_on:
      - support-desk

volumes:
  support-data:
  n8n-data:
